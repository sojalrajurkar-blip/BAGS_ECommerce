name: RÓRA Luxury Atelier — CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ============================================================================
  # 1. Backend CI Job (Java 21 + Maven + 202 Unit/Integration Tests)
  # ============================================================================
  backend-test:
    name: Backend Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rora_test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven Full Test Suite
        working-directory: ./backend
        run: mvn clean test -B
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Package Spring Boot Production JAR
        working-directory: ./backend
        run: mvn package -DskipTests -B

      - name: Upload Backend Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rora-backend-jar
          path: backend/target/rora-backend-*.jar
          retention-days: 7

  # ============================================================================
  # 2. Frontend CI Job (Node 20 + TypeScript + Next.js Production Build)
  # ============================================================================
  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify TypeScript & Build Next.js
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
